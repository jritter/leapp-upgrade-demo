---
# ansible-navigator configuration for the LEAPP upgrade demo.
#
# Why an EE: recent ansible-core (e.g. 2.20 on Fedora) cannot manage RHEL 8
# (python3-dnf / platform-python). This EE pins ansible-core 2.16 + redhat.leapp.
#
# Build: ./scripts/build-ee.sh
# Run:   ./scripts/run-with-navigator.sh playbooks/00-prepare.yml leapp-rhel8
ansible-navigator:
  ansible:
    config:
      path: ansible.cfg
    inventory:
      entries:
        - inventory
  app: run
  mode: stdout
  playbook-artifact:
    enable: false
  execution-environment:
    container-engine: podman
    enabled: true
    # Custom EE: ee-minimal-rhel9:2.16.19-1 + redhat.leapp
    image: localhost/leapp-upgrade-ee:2.16
    pull:
      policy: missing
    environment-variables:
      pass:
        - SSH_AUTH_SOCK
    volume-mounts:
      # SSH keys for reaching libvirt guests
      - src: ~/.ssh
        dest: /runner/.ssh
        options: Z
  logging:
    level: warning
