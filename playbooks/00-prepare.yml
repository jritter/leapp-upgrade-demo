---
- name: Bootstrap Python for Ansible (RHEL 8 cloud images)
  hosts: leapp_targets
  gather_facts: false
  become: true
  tasks:
    - name: Assert ansible_host is set (run scripts/inventory-from-libvirt.sh)
      ansible.builtin.assert:
        that:
          - ansible_host is defined
          - ansible_host | length > 0
        fail_msg: >-
          ansible_host is missing for {{ inventory_hostname }}.
          Create the VM and run scripts/inventory-from-libvirt.sh.

- name: Prepare LEAPP demo targets
  hosts: leapp_targets
  gather_facts: true
  become: true
  tasks:
    - name: Show current OS release
      ansible.builtin.command: cat /etc/redhat-release
      register: redhat_release
      changed_when: false

    - name: Display release
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is running: {{ redhat_release.stdout }}"

    - name: Verify RHSM is registered
      ansible.builtin.command: subscription-manager identity
      register: rhsm_identity
      changed_when: false
      failed_when: rhsm_identity.rc != 0
