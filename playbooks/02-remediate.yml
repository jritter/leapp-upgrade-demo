---
# Prefer the remediate.yml generated by infra.leapp.analysis when present.
# This playbook is a stable entry point for the demo scripts.
- name: LEAPP remediate inhibitors
  hosts: leapp_targets
  gather_facts: true
  become: true
  tasks:
    - name: Apply available remediations
      ansible.builtin.import_role:
        name: infra.leapp.remediate
