---
- name: LEAPP pre-upgrade analysis
  hosts: leapp_targets
  gather_facts: true
  become: true
  tasks:
    - name: Run infra.leapp.analysis
      ansible.builtin.import_role:
        name: infra.leapp.analysis
      vars:
        leapp_preupg_opts: "{{ leapp_upgrade_opts | default(omit) }}"

    - name: Upload analysis results to Red Hat Lightspeed
      ansible.builtin.command: insights-client
      changed_when: true
