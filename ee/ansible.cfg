# Used only during ansible-builder galaxy install (copied into the build context).
# Provide the token at build time (do not commit secrets):
#   export ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_TOKEN="<hub-offline-token>"
#   ansible-builder build ... --build-arg ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_TOKEN

[galaxy]
server_list = automation_hub

[galaxy_server.automation_hub]
url = https://console.redhat.com/api/automation-hub/content/published/
auth_url = https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
